[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formatflux"
version = "1.0.0"
description = "Sistema de procesamiento multimedia con CLI y GUI"
authors = [
    { name = "Walter", email = "waltercunbustamante@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["multimedia", "video", "audio", "conversión", "procesamiento"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyQt6 >= 6.11.0",
    "typer >= 0.12.0",
    "opencv-python >= 4.9.0",
    "whisper >= 1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.4.0",
    "black >= 24.0.0",
    "ruff >= 0.4.0",
]

[project.scripts]
formatflux = "formatflux.cli.main:app"

[tool.typer]
module = "formatflux.cli.main"